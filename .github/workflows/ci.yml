name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────
  # TypeScript Extension Build, Lint & Test
  # ─────────────────────────────────────────────
  typescript:
    name: TypeScript Extension
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Build extension
        run: cd client && npm run build

      - name: Check TypeScript types
        run: cd client && npx tsc --noEmit
        continue-on-error: true

      - name: Run unit tests with coverage
        run: cd client && npm run test:ci

      - name: Upload coverage to Codecov
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v4
        with:
          files: client/coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

      - name: Upload coverage artifact
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: client/coverage/
          retention-days: 14

      - name: Upload extension artifact
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: extension-js
          path: client/dist/extension.js
          retention-days: 7

  # ─────────────────────────────────────────────
  # Rust LSP Server Build & Test
  # ─────────────────────────────────────────────
  rust:
    name: Rust LSP Server
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cd server && cargo fmt --check
        continue-on-error: true

      - name: Clippy lints
        run: cd server && cargo clippy -- -D warnings
        continue-on-error: true

      - name: Build release
        run: cd server && cargo build --release

      - name: Install SBOL and SBML validators
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -m pip install 'sbol3==1.2' python-libsbml \
            || "$PY" -m pip install --user 'sbol3==1.2' python-libsbml \
            || "$PY" -m pip install --break-system-packages 'sbol3==1.2' python-libsbml
          "$PY" -c 'import sbol3, libsbml'

      - name: Run tests
        run: cd server && cargo test

      - name: Upload binary artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: synbio-lsp-${{ matrix.os }}
          path: server/target/release/synbio-lsp*
          retention-days: 7

  # ─────────────────────────────────────────────
  # Python Engine
  # ─────────────────────────────────────────────
  python:
    name: Python Engine
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        continue-on-error: true

      - name: Check syntax
        run: python -m py_compile python-engine/server.py

      - name: Setup Node.js
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate web demo SBOL3 and SBML exports
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install 'sbol3==1.2' python-libsbml
          npx --yes tsx web-demo/scripts/export-fixtures.ts /tmp/synbio-web-exports
          python scripts/validate_exports.py /tmp/synbio-web-exports

  # ─────────────────────────────────────────────
  # VS Code Extension Package
  # ─────────────────────────────────────────────
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: [typescript, rust]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci
          cd client && npm ci

      - name: Build
        run: cd client && npm run build

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package extension
        run: cd client && vsce package --no-dependencies
        continue-on-error: true

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: synbio-llvm-vsix
          path: client/*.vsix
          retention-days: 30
          if-no-files-found: ignore
