name: Build web demo

on:
  push:
    branches: [main]
    paths:
      - 'web-demo/**'
      - '.github/workflows/deploy-demo.yml'
  pull_request:
    paths:
      - 'web-demo/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

# The public GitHub Pages site is the landing page in docs/, published by
# pages.yml. This workflow only checks that the Next.js demo still builds.

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-demo
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npx next build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /Synbio-studio
