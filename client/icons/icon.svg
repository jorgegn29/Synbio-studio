<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a2332"/>
    </linearGradient>
    <linearGradient id="dna1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="dna2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- DNA Helix strand 1 -->
  <path d="M40 20 C55 35, 73 35, 88 20 C73 50, 55 50, 40 65 C55 80, 73 80, 88 65 C73 95, 55 95, 40 110" 
        stroke="url(#dna1)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- DNA Helix strand 2 -->
  <path d="M88 20 C73 35, 55 35, 40 20 C55 50, 73 50, 88 65 C73 80, 55 80, 40 65 C55 95, 73 95, 88 110" 
        stroke="url(#dna2)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Base pair connections -->
  <line x1="52" y1="28" x2="76" y2="28" stroke="#4ade80" stroke-width="2" opacity="0.6"/>
  <line x1="48" y1="42" x2="80" y2="42" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <line x1="52" y1="57" x2="76" y2="57" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
  <line x1="48" y1="72" x2="80" y2="72" stroke="#4ade80" stroke-width="2" opacity="0.6"/>
  <line x1="52" y1="87" x2="76" y2="87" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <line x1="48" y1="102" x2="80" y2="102" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
  <!-- Compiler brackets -->
  <text x="18" y="78" font-family="monospace" font-size="36" font-weight="bold" fill="#4ade80" opacity="0.8">{</text>
  <text x="96" y="78" font-family="monospace" font-size="36" font-weight="bold" fill="#22d3ee" opacity="0.8">}</text>
</svg>
