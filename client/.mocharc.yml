# ══════════════════════════════════════════════════════════════
# Mocha Configuration — SynBio-LLVM Test Suite
# ══════════════════════════════════════════════════════════════
ui: tdd
color: true
timeout: 15000
reporter: spec
recursive: true
spec:
  - "src/test/unit/**/*.test.ts"
  - "src/test/integration/**/*.test.ts"
  - "src/test/perf/**/*.test.ts"
  - "src/test/benchmarks/**/*.test.ts"
  - "src/test/smoke/**/*.test.ts"
ignore:
  - "src/test/e2e/**"
require:
  - tsx
