[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synbio-studio-engine"
version = "1.0.1"
description = "Local FastAPI engine for SynBio Studio: ODE and Gillespie simulation, with optional FBA, alignment, and model endpoints."
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "Jorge Guillem Najarro" },
]
keywords = ["synthetic-biology", "simulation", "fastapi"]
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.5.3",
  "python-multipart>=0.0.6",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
]

[project.optional-dependencies]
bio = [
  "biopython>=1.83",
  "httpx>=0.27.0",
  "gillespy2>=1.8.0",
  "cobra>=0.29.0",
]
ml = [
  "scikit-learn>=1.4.0",
  "torch>=2.3.0",
  "onnx>=1.16.0",
  "onnxscript>=0.2.0",
  "onnxruntime>=1.17.0",
]
tutor = [
  "tensorflow-cpu>=2.20.0",
]
dev = [
  "pytest>=7.4.0",
]

[project.urls]
Homepage = "https://github.com/jorgegn29/Synbio-studio"
Repository = "https://github.com/jorgegn29/Synbio-studio"
Documentation = "https://github.com/jorgegn29/Synbio-studio#readme"

[tool.setuptools]
py-modules = [
  "server",
  "inverse_circuit_design",
  "codon_bert_model",
  "crispr_offtarget_model",
  "esmfold_structure",
  "promoter_strength_model",
  "synbio_tutor_model",
  "synbio_tutor_curated_library",
  "build_synbio_tutor_corpus",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
addopts = "-q"
