function acquireVsCodeApi(){
  const key='synbio-wv-'+"synbiotutorinstall-configurar-tutor-ai-de-synbio";

    postMessage(msg){ parent.postMessage({source:'webview', panel:"synbiotutorinstall-configurar-tutor-ai-de-synbio", msg}, '*'); },
    getState(){ try { return JSON.parse(localStorage.getItem(key)||'null'); } catch(e){ return null; } },
    setState(state){ localStorage.setItem(key, JSON.stringify(state)); return state; }
  };
}

  if (event.data && event.data.source === 'host' && event.data.panel === "synbiotutorinstall-configurar-tutor-ai-de-synbio") {
    window.dispatchEvent(new MessageEvent('message', { data: event.data.msg }));
  }
});
