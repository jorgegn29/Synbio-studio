<!DOCTYPE html><html><head><script>
function acquireVsCodeApi(){
  const key='synbio-wv-'+"experimentplanner-experiment-planner-lab-notebook";
  return {
    postMessage(msg){ parent.postMessage({source:'webview', panel:"experimentplanner-experiment-planner-lab-notebook", msg}, '*'); },
    getState(){ try { return JSON.parse(localStorage.getItem(key)||'null'); } catch(e){ return null; } },
    setState(state){ localStorage.setItem(key, JSON.stringify(state)); return state; }
  };
}
window.addEventListener('message', (event) => {
  if (event.data && event.data.source === 'host' && event.data.panel === "experimentplanner-experiment-planner-lab-notebook") {
    window.dispatchEvent(new MessageEvent('message', { data: event.data.msg }));
  }
});
</script><meta charset="UTF-8">
<style>

button:hover{opacity:0.8}
.btn-main{padding:8px 16px;background:#89b4fa;color:#1a1a2e;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:12px}
</style></head><body>
